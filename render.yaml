services:
  - type: web
    name: tecvote-api
    env: python
    plan: free
    buildCommand: pip install -r requirements/prod.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn tecvote.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: "tecvote.settings.prod"  
      - key: DATABASE_URL
        fromDatabase:
          name: tecvote-db
          property: connectionString
      - key: SECRET_KEY
        value: "ah#na_h3(4x)*g6u_vygk&mv^re@lhs_8og7qtnr#7*gdxv5qf"  
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS_PROD
        value: "https://tecvote-api.onrender.com"

databases:
  - name: tecvote-db
    plan: free
    databaseName: tecvote_db
    user: tecvote_user